<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <style>
      .button {
        padding: 1px 6px;
        border: 2px solid #c0c0c0;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        font-size: 25px;
        font-weight: 900;
      }

      .button-blue {
        background-color: #224fca;
        color: #fff;
      }
      .button-white {
        background-color: #fff;
      }
      .button-white:hover {
        background-color: #224fca;
        border: #224fca;
        color: #fff;
      }
      .button-green {
        background-color: #07b810;
        color: #fff;
      }
      .button-green:hover {
        background-color: #09610f;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <h2>Câu 1: Buttons (Nút bấm)</h2>
    <p>
      <strong>Yêu cầu: </strong>sử dụng HTLM và CSS để dựng nút bấm bên dưới
      (Dùng thẻ button).
    </p>
    <button class="button button-blue">
      <i class="fa-solid fa-caret-right"></i>
    </button>
    <button class="button button-white">
      <i class="fa-solid fa-caret-right"></i>
    </button>
    <button class="button button-green">
      <i class="fa-solid fa-phone-volume"></i>
    </button>
  </body>
</html>
