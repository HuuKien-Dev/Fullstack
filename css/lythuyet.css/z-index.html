<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phần 2</title>
  </head>
  <body>
    <style>
      .box {
        position: relative;
        width: 200px;
        height: 200px;
      }

      .box-1 {
        background-color: red;
        z-index: 2;
      }

      .box-2 {
        background-color: blue;
        margin-top: -100px;
        margin-left: 100px;
        z-index: 3;
      }

      .box-3 {
        background-color: orange;
        margin-top: -100px;
        margin-left: 200px;
        z-index: 4;
      }
    </style>
    <!-- 
     - để thay đổi thứ tự xếp chồng của các phần tử ta sử dụng thuộc tính z-index
     - z-index chỉ có tác dụng khi phần tử có thuộc tính position là relative, absolute
      -->

    <div class="box box-1"></div>
    <div class="box box-2"></div>
    <div class="box box-3"></div>
  </body>
</html>
