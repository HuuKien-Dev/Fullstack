<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variable</title>
  </head>
  <body>
    <style>
      :root {
        --main-color: red;
        --secondary-color: blue;
      }
      h2 {
        color: var(--main-color);
      }
      h3 {
        color: var(--secondary-color);
      }
      h4 {
        color: var(--main-color);
        background-color: var(--secondary-color);
      }
    </style>
    <h2>Doan van 1</h2>
    <h3>Doan van 2</h3>
    <h4>Doan van 3</h4>
  </body>
</html>
