<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <style>
      .button {
        padding: 16px 30px;
        border: #ddd8d8 solid 2px;
        margin-left: 5px;
        background: #fff;
        color: #0e0d0d;
        font-weight: 700;
      }
      .button:hover {
        background: #202bcc;
        color: #fff;
      }
      .button-border {
        border-radius: 8px;
      }
      .button-round {
        border-radius: 45px;
      }
    </style>
    <title>Button</title>
  </head>
  <body>
    <h2>Câu 1: Buttons (Nút bấm)</h2>
    <p>
      <strong>Yêu cầu: </strong>sử dụng HTML và CSS để dựng nút bên dưới (Dùng
      thẻ button).
    </p>
    <button class="button">Button 1</button>
    <button class="button button-border">
      Button 2 <i class="fa-solid fa-caret-right"></i>
    </button>
    <button class="button button-round">
      Button 3<i class="fa-solid fa-chevron-right"></i>
    </button>
    <button class="button button-round">
      Button 4
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </body>
</html>
